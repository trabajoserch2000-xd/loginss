
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    <link rel="stylesheet" href="contra.css">
</head>

<body>

    <div class="container">

        <h1>Iniciar sesión</h1>
        <p>Ingresa tus datos para continuar</p>

        <input type="text" id="correoinput" placeholder="Usuario">

        <input type="password" id="claveinput" placeholder="Contraseña">

        <button onclick="iniciarSesion()">Ingresar</button>

        <div id="mensaje"></div>

    </div>

    <script>
        function iniciarSesion() {

            let usuario = document.getElementById("correoinput").value;
            let contraseña = document.getElementById("claveinput").value;
            let mensaje = document.getElementById("mensaje");

            if (usuario === "pro123" && contraseña === "serch") {

                window.location.href = "bienvenido.html";

            } else {

                mensaje.innerHTML = "USUARIO NO VÁLIDO";
                mensaje.style.color = "red";

            }
        }
    </script>

</body>
</html>
